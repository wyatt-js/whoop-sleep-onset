name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: GOOS=linux GOARCH=arm64 go build ./cmd/lambda-api ./cmd/lambda-sync
